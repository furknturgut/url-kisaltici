name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci_sifre
          POSTGRES_DB: urldb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      VERITABANI_ADRESI: postgresql://admin:ci_sifre@localhost:5432/urldb
      GIZLI_ANAHTAR: ci-icin-gecici-test-anahtari

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Veritabanı tablolarını oluştur
        run: psql postgresql://admin:ci_sifre@localhost:5432/urldb -f schema.sql

      - name: Testleri çalıştır
        run: pytest -v